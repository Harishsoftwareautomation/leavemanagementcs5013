# Configuration for Leave Management System

## Application Configuration

# Application Name
app.name=Leave Management System
app.version=1.0.0
app.author=Development Team

## Database Configuration

# Database type
db.type=sqlite

# Database file path (relative to project root)
db.file=leavemanagement.db

# Database URL
db.url=jdbc:sqlite:leavemanagement.db

# Enable auto table creation
db.auto.create=true

## Leave Types Default Configuration

# These are the default leave types that should be initialized
leave.types[0].name=Sick Leave
leave.types[0].days=12
leave.types[0].description=Leave for health-related issues

leave.types[1].name=Casual Leave
leave.types[1].days=10
leave.types[1].description=General casual leave for personal use

leave.types[2].name=Personal Leave
leave.types[2].days=5
leave.types[2].description=Personal leave for emergency situations

## Employee Configuration

# Default employee status
employee.default.status=ACTIVE

# Minimum salary validation
employee.salary.minimum=0.0

# Email validation enabled
employee.email.validation=true

## Leave Request Configuration

# Allow leave request for past dates
leave.allow.past=false

# Minimum days advance notice required (in days)
leave.advance.notice.days=1

# Enable weekend exclusion in leave calculation
leave.exclude.weekends=false

## System Configuration

# Date format (ISO: yyyy-MM-dd)
date.format=yyyy-MM-dd

# Enable logging
logging.enabled=true

# Log level (INFO, DEBUG, ERROR)
logging.level=INFO

## Feature Flags

# Enable email notifications
feature.email.notification=false

# Enable leave carryover
feature.leave.carryover=false

# Enable multi-level approval
feature.multi.level.approval=false

# Enable holiday calendar
feature.holiday.calendar=false

## Performance Configuration

# Database connection pooling
db.connection.pool.enabled=false

# Cache enabled
cache.enabled=false

# Cache size (number of records)
cache.size=1000

## Validation Configuration

# Maximum reason length (characters)
validation.reason.max.length=500

# Minimum reason length (characters)
validation.reason.min.length=5

# Maximum number of days for single leave request
validation.max.days=30

# Enable strict validation
validation.strict=true

## Security Configuration

# Enable password protection
security.password.enabled=false

# Enable role-based access control
security.rbac.enabled=false

# Session timeout (in minutes)
security.session.timeout=30

## Report Configuration

# Report directory
report.directory=./reports

# Enable PDF generation
report.pdf.enabled=false

# Enable Excel export
report.excel.enabled=false

## Integration Configuration

# Email server configuration
mail.smtp.host=localhost
mail.smtp.port=587
mail.smtp.user=
mail.smtp.password=

# SMS notification (if enabled)
sms.enabled=false
sms.provider=

# API integration enabled
api.enabled=false
api.port=8080
api.base.path=/api/v1

---

## Notes:
- This is a configuration template
- Current version uses default hardcoded configurations
- Future versions can use this file for external configuration
- Edit values as per your organization's policies
