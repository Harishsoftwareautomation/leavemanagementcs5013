<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <title>Change Password - Leave Management System</title>
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Change your password</h5>
                    </div>
                    <div class="card-body">
                        <p class="text-muted" id="mustChangeNote" hidden>You are using a temporary password. Please choose your own password to continue.</p>
                        <form id="changePasswordForm">
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">Current password</label>
                                <input type="password" class="form-control" id="currentPassword" autocomplete="current-password" required>
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">New password (at least 8 characters)</label>
                                <input type="password" class="form-control" id="newPassword" minlength="8" autocomplete="new-password" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm new password</label>
                                <input type="password" class="form-control" id="confirmPassword" minlength="8" autocomplete="new-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Change password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const me = await getCurrentUser();
            if (me && me.mustChangePassword) {
                document.getElementById('mustChangeNote').hidden = false;
            }
            document.getElementById('changePasswordForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                const newPassword = document.getElementById('newPassword').value;
                if (newPassword !== document.getElementById('confirmPassword').value) {
                    showAlert('The new passwords do not match', 'danger');
                    return;
                }
                const result = await apiCall('/me/password', 'POST', {
                    currentPassword: document.getElementById('currentPassword').value,
                    newPassword: newPassword
                });
                if (result) {
                    window.location.href = '/lms/';
                }
            });
        });
    </script>
</body>
</html>
